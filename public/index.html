<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adding Number Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #334155;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b, var(--bg));
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px 16px;
    }
    .app { width: 100%; max-width: 560px; }
    h1 { text-align: center; font-size: 1.7rem; margin: 0 0 4px; }
    .tagline { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 0.9rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="number"], input[type="text"], select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--panel-2);
      background: #0b1222;
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 16px;
    }
    input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .row { display: flex; gap: 14px; }
    .row > div { flex: 1; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px 16px;
      color: #0b1222;
      background: var(--accent);
      transition: transform 0.05s ease, filter 0.15s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.secondary { background: var(--panel-2); color: var(--text); }
    button.block { width: 100%; }
    .warn { color: var(--danger); font-size: 0.85rem; margin: -8px 0 14px; min-height: 1em; }
    .hint { color: var(--muted); font-size: 0.85rem; margin: 4px 0 14px; }
    .hidden { display: none !important; }

    /* Game board */
    .scoreboard { text-align: center; margin-bottom: 18px; }
    .total { font-size: 4rem; font-weight: 800; line-height: 1; color: var(--accent); }
    .target { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
    .turn {
      text-align: center; font-size: 1.1rem; font-weight: 700; margin: 6px 0 18px;
      min-height: 1.4em;
    }
    .adds { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 18px; }
    .adds button { min-width: 58px; font-size: 1.2rem; }

    /* Two-column board (hotseat / vs computer) */
    .two-col { display: flex; gap: 14px; margin-bottom: 18px; }
    .player-col {
      flex: 1; border: 1px solid var(--panel-2); border-radius: 12px; padding: 14px;
      text-align: center; transition: opacity .15s ease, border-color .15s ease;
    }
    .player-col.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56,189,248,.25) inset; }
    .player-col.dim { opacity: .45; }
    .player-col .pname { font-weight: 700; margin-bottom: 10px; }
    .player-col .adds { margin-bottom: 0; }
    @media (max-width: 420px) { .two-col { flex-direction: column; } }
    .banner {
      text-align: center; font-size: 1.4rem; font-weight: 800; padding: 14px;
      border-radius: 12px; background: rgba(34,197,94,0.15); color: var(--accent-2);
      margin-bottom: 16px;
    }
    .banner.lose { background: rgba(248,113,113,0.15); color: var(--danger); }
    .status { text-align: center; color: var(--muted); font-size: 0.9rem; min-height: 1.2em; margin-bottom: 12px; }
    .scores {
      display: flex; justify-content: center; align-items: center; gap: 14px;
      font-weight: 700; margin-bottom: 12px;
    }
    .scores .sc { text-align: center; }
    .scores .sc .n { font-size: 1.6rem; color: var(--accent); }
    .scores .sc .who { font-size: 0.75rem; color: var(--muted); font-weight: 600; }
    .scores .dash { color: var(--muted); font-size: 1.2rem; }
    .log {
      background: #0b1222; border-radius: 10px; padding: 10px 12px; max-height: 140px;
      overflow-y: auto; font-size: 0.85rem; color: var(--muted); margin-bottom: 16px;
    }
    .log div { padding: 2px 0; }
    .code-box {
      text-align: center; font-size: 1.8rem; font-weight: 800; letter-spacing: 4px;
      background: #0b1222; border-radius: 10px; padding: 12px; margin-bottom: 14px;
      color: var(--accent);
    }
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .mode-tabs button { flex: 1; padding: 10px; font-size: 0.9rem; }
    .mode-tabs button.active { background: var(--accent); color: #0b1222; }
    .mode-tabs button:not(.active) { background: var(--panel-2); color: var(--text); }
  </style>
</head>
<body>
  <div class="app">
    <h1>➕ Adding Number Game</h1>
    <p class="tagline">Add up to <em>Max add</em> each turn. First to reach the <em>Target</em> wins.</p>

    <!-- SETUP -->
    <div id="setup" class="panel">
      <div class="mode-tabs">
        <button data-mode="hotseat" class="active">Two players</button>
        <button data-mode="cpu">vs Computer</button>
        <button data-mode="online">Online</button>
      </div>

      <!-- shared params (hidden for online-join) -->
      <div id="paramFields">
        <div class="row">
          <div>
            <label for="target">Target (24–150)</label>
            <input type="number" id="target" value="60" min="24" max="150" />
          </div>
          <div>
            <label for="maxAdd">Max add (2–15)</label>
            <input type="number" id="maxAdd" value="4" min="2" max="15" />
          </div>
        </div>
        <div class="hint">Target ÷ (Max add + 1) must be between 8 and 15.</div>
        <div id="warn" class="warn"></div>
      </div>

      <!-- vs computer: who sets the numbers (the other side then chooses first/second) -->
      <div id="cpuOptions" class="hidden">
        <label for="setter">Who sets Target &amp; Max add?</label>
        <select id="setter">
          <option value="you">You</option>
          <option value="cpu">Computer</option>
        </select>
        <div id="setterHint" class="hint">The other side then chooses to move first or second, so the numbers can't be rigged.</div>
      </div>

      <!-- online: create or join -->
      <div id="onlineOptions" class="hidden">
        <div class="mode-tabs" id="onlineTabs">
          <button data-online="create" class="active">Create room</button>
          <button data-online="join">Join room</button>
        </div>
        <div id="joinFields" class="hidden">
          <label for="roomCode">Room code</label>
          <input type="text" id="roomCode" placeholder="e.g. ABC123" maxlength="6" style="text-transform:uppercase" />
        </div>
      </div>

      <button id="startBtn" class="block">Start game</button>
    </div>

    <!-- GAME -->
    <div id="game" class="panel hidden">
      <div id="roomInfo" class="hidden">
        <label style="text-align:center">Share this room code</label>
        <div id="codeBox" class="code-box"></div>
      </div>
      <div id="status" class="status"></div>

      <!-- cut-and-choose: the non-setter picks who moves first -->
      <div id="choosePanel" class="hidden">
        <div id="chooseInfo" class="hint" style="text-align:center"></div>
        <div class="row">
          <div><button id="chooseFirstBtn" class="block">Move first</button></div>
          <div><button id="chooseSecondBtn" class="block secondary">Move second</button></div>
        </div>
      </div>

      <div id="boardArea">
        <div id="scores" class="scores hidden"></div>

        <div id="banner" class="banner hidden"></div>

        <div class="scoreboard">
          <div class="total" id="totalDisplay">0</div>
          <div class="target" id="targetDisplay"></div>
        </div>
        <div class="turn" id="turnDisplay"></div>

        <!-- online: single shared row of buttons -->
        <div class="adds" id="addButtons"></div>

        <!-- local (hotseat / vs computer): a column per player, each with its own buttons -->
        <div class="two-col hidden" id="twoCol">
          <div class="player-col" id="colP1">
            <div class="pname" id="nameP1"></div>
            <div class="adds" id="addsP1"></div>
          </div>
          <div class="player-col" id="colP2">
            <div class="pname" id="nameP2"></div>
            <div class="adds" id="addsP2"></div>
          </div>
        </div>

        <div class="log" id="log"></div>
      </div>

      <div class="row">
        <div><button id="againBtn" class="secondary block hidden">Play again</button></div>
        <div><button id="menuBtn" class="secondary block">Menu</button></div>
      </div>
    </div>
  </div>

  <script src="/game.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);

    // ---- UI element refs ----
    const setupEl = $('setup');
    const gameEl = $('game');
    const modeTabs = document.querySelectorAll('.mode-tabs [data-mode]');
    const onlineTabs = document.querySelectorAll('#onlineTabs [data-online]');

    let mode = 'hotseat';        // 'hotseat' | 'cpu' | 'online'
    let onlineAction = 'create'; // 'create' | 'join'

    // ---- runtime game context ----
    let ctx = null; // holds state + mode-specific fields

    // ===== Setup interactions =====
    modeTabs.forEach((btn) => btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      modeTabs.forEach((b) => b.classList.toggle('active', b === btn));
      $('cpuOptions').classList.toggle('hidden', mode !== 'cpu');
      $('onlineOptions').classList.toggle('hidden', mode !== 'online');
      updateParamVisibility();
    }));

    onlineTabs.forEach((btn) => btn.addEventListener('click', () => {
      onlineAction = btn.dataset.online;
      onlineTabs.forEach((b) => b.classList.toggle('active', b === btn));
      $('joinFields').classList.toggle('hidden', onlineAction !== 'join');
      updateParamVisibility();
    }));

    // The party that SETS the numbers doesn't get to pick their seat, so hide the
    // inputs when the local player isn't the setter: joining an online room, or
    // (vs Computer) when the computer sets the numbers.
    $('setter').addEventListener('change', updateParamVisibility);

    function cpuSetsNumbers() {
      return mode === 'cpu' && $('setter').value === 'cpu';
    }

    function updateParamVisibility() {
      const joining = mode === 'online' && onlineAction === 'join';
      const cpuAuto = cpuSetsNumbers();
      $('paramFields').classList.toggle('hidden', joining || cpuAuto);
    }

    // Computer chooses a valid Target and Max add when it sets the parameters:
    // maxAdd in range, then a target that keeps target/(maxAdd+1) within [8,15].
    function computerDecideParams() {
      const L = Game.PARAM_LIMITS;
      let maxAdd, lo, hi;
      do {
        maxAdd = L.maxAddMin + Math.floor(Math.random() * (L.maxAddMax - L.maxAddMin + 1));
        const k = maxAdd + 1;
        lo = Math.max(L.targetMin, L.ratioMin * k);
        hi = Math.min(L.targetMax, L.ratioMax * k);
      } while (lo > hi); // retry maxAdd values (e.g. 2) that admit no valid target
      const target = lo + Math.floor(Math.random() * (hi - lo + 1));
      return { target, maxAdd };
    }

    // Cut-and-choose: when the computer is the chooser, it takes the winning seat.
    // The mover-to-play loses iff target is a multiple of (maxAdd + 1); so the first
    // mover wins otherwise. Returns the player number (1=You, 2=Computer) to move first.
    function computerChooseSeat(params) {
      const firstMoverWins = params.target % (params.maxAdd + 1) !== 0;
      return firstMoverWins ? 2 : 1; // computer takes first if first-mover wins, else lets you go first
    }

    function validateParams() {
      const L = Game.PARAM_LIMITS;
      const target = parseInt($('target').value, 10);
      const maxAdd = parseInt($('maxAdd').value, 10);
      $('warn').textContent = '';
      if (!Number.isInteger(target) || target < L.targetMin || target > L.targetMax) {
        $('warn').textContent = `Target must be between ${L.targetMin} and ${L.targetMax}.`; return null;
      }
      if (!Number.isInteger(maxAdd) || maxAdd < L.maxAddMin || maxAdd > L.maxAddMax) {
        $('warn').textContent = `Max add must be between ${L.maxAddMin} and ${L.maxAddMax}.`; return null;
      }
      const ratio = target / (maxAdd + 1);
      if (ratio < L.ratioMin || ratio > L.ratioMax) {
        $('warn').textContent = `Target ÷ (Max add + 1) must be between ${L.ratioMin} and ${L.ratioMax} (now ${ratio.toFixed(1)}).`;
        return null;
      }
      return { target, maxAdd };
    }

    $('startBtn').addEventListener('click', () => {
      if (mode === 'online') return startOnline();
      if (mode === 'hotseat') {
        const params = validateParams();
        if (!params) return;
        return startLocal(params, { vsCpu: false, firstMover: 1 });
      }
      // vs Computer, cut-and-choose:
      if (cpuSetsNumbers()) {
        // Computer sets the numbers; YOU choose to move first or second.
        const params = computerDecideParams();
        showGame();
        $('roomInfo').classList.add('hidden');
        showChoosePanel(
          `Computer set Target ${params.target} · Max add ${params.maxAdd}. Move first or second?`,
          () => startLocal(params, { vsCpu: true, firstMover: 1 }), // you first
          () => startLocal(params, { vsCpu: true, firstMover: 2 })  // computer first
        );
      } else {
        // You set the numbers; the computer takes the winning seat.
        const params = validateParams();
        if (!params) return;
        startLocal(params, { vsCpu: true, firstMover: computerChooseSeat(params) });
      }
    });

    $('menuBtn').addEventListener('click', backToMenu);
    $('againBtn').addEventListener('click', () => {
      if (!ctx) return;
      if (ctx.online) { ctx.ws.send(JSON.stringify({ type: 'rematch' })); }
      else startLocal({ target: ctx.state.target, maxAdd: ctx.state.maxAdd }, { vsCpu: ctx.vsCpu, firstMover: ctx.firstMover, scores: ctx.scores });
    });

    function showGame() { setupEl.classList.add('hidden'); gameEl.classList.remove('hidden'); }
    function backToMenu() {
      if (ctx && ctx.online) { ctx.left = true; if (ctx.ws) { try { ctx.ws.close(); } catch (e) {} } }
      ctx = null;
      gameEl.classList.add('hidden');
      setupEl.classList.remove('hidden');
      hideChoosePanel();
      $('roomInfo').classList.add('hidden');
      $('banner').classList.add('hidden');
      $('scores').classList.add('hidden');
    }

    // ===== Cut-and-choose seat picker =====
    function showChoosePanel(infoText, onFirst, onSecond) {
      $('chooseInfo').textContent = infoText;
      $('chooseFirstBtn').onclick = () => { hideChoosePanel(); onFirst(); };
      $('chooseSecondBtn').onclick = () => { hideChoosePanel(); onSecond(); };
      $('boardArea').classList.add('hidden');
      $('choosePanel').classList.remove('hidden');
    }
    function hideChoosePanel() {
      $('choosePanel').classList.add('hidden');
      $('boardArea').classList.remove('hidden');
    }

    // ===== Local modes (hotseat + vs computer) =====
    // opts: { vsCpu, firstMover (1|2, player who moves first), scores }
    function startLocal(params, opts) {
      opts = opts || {};
      const vsCpu = !!opts.vsCpu;
      const firstMover = opts.firstMover === 2 ? 2 : 1;
      ctx = {
        online: false, vsCpu, firstMover,
        state: Game.createState(params.target, params.maxAdd, firstMover),
        scores: opts.scores || { 1: 0, 2: 0 },
        cpuPlayer: vsCpu ? 2 : null, // You are player 1, the computer is player 2
      };
      $('roomInfo').classList.add('hidden');
      $('log').innerHTML = '';
      showGame();
      render();
      maybeCpuMove();
    }

    function localMove(n) {
      if (!Game.isValidMove(ctx.state, n)) return;
      const player = ctx.state.currentPlayer;
      Game.applyMove(ctx.state, n);
      if (ctx.state.winner !== null) ctx.scores[ctx.state.winner]++;
      logMove(playerLabel(player), n, ctx.state.total);
      render();
      maybeCpuMove();
    }

    function maybeCpuMove() {
      if (!ctx.vsCpu || ctx.state.winner !== null) return;
      if (ctx.state.currentPlayer !== ctx.cpuPlayer) return;
      setStatus('Computer is thinking…');
      setTimeout(() => {
        if (!ctx || ctx.state.winner !== null) return;
        const n = Game.bestMove(ctx.state);
        setStatus('');
        localMove(n);
      }, 650);
    }

    // ===== Online mode (WebSocket) =====
    function startOnline() {
      let params = null;
      if (onlineAction === 'create') {
        params = validateParams();
        if (!params) return;
      } else {
        const code = ($('roomCode').value || '').trim().toUpperCase();
        if (!code) { $('warn').textContent = 'Enter a room code to join.'; return; }
        params = { code };
      }

      ctx = {
        online: true, ws: null, myPlayer: null, state: null, scores: null,
        token: null, roomCode: params.code || null, action: onlineAction,
        params, left: false, retries: 0,
      };
      $('log').innerHTML = '';
      showGame();
      $('banner').classList.add('hidden');
      $('againBtn').classList.add('hidden');
      $('scores').classList.add('hidden');
      openSocket();
    }

    function openSocket() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}`);
      ctx.ws = ws;
      setStatus(ctx.token ? 'Reconnecting…' : 'Connecting…');

      ws.addEventListener('open', () => {
        ctx.retries = 0;
        if (ctx.token) {
          ws.send(JSON.stringify({ type: 'reconnect', code: ctx.roomCode, token: ctx.token }));
        } else if (ctx.action === 'create') {
          ws.send(JSON.stringify({ type: 'create', target: ctx.params.target, maxAdd: ctx.params.maxAdd }));
        } else {
          ws.send(JSON.stringify({ type: 'join', code: ctx.params.code }));
        }
      });

      ws.addEventListener('message', (ev) => handleServerMessage(JSON.parse(ev.data)));
      ws.addEventListener('close', () => tryReconnect());
      ws.addEventListener('error', () => { try { ws.close(); } catch (e) {} });
    }

    function tryReconnect() {
      if (!ctx || !ctx.online || ctx.left) return;
      if (!ctx.token) { setStatus('Could not reach the server.'); return; } // never joined a room
      if (ctx.retries >= 6) { setStatus('Lost connection. Return to menu and rejoin.'); return; }
      ctx.retries++;
      setStatus(`Reconnecting… (attempt ${ctx.retries})`);
      setTimeout(() => { if (ctx && ctx.online && !ctx.left) openSocket(); }, 1500 * ctx.retries);
    }

    function handleServerMessage(msg) {
      switch (msg.type) {
        case 'created':
          ctx.myPlayer = msg.player;
          ctx.token = msg.token;
          ctx.roomCode = msg.code;
          $('roomInfo').classList.remove('hidden');
          $('codeBox').textContent = msg.code;
          setStatus('Waiting for opponent to join…');
          break;
        case 'joined':
          ctx.myPlayer = msg.player; // server tells joiner they are player 2
          ctx.token = msg.token;
          break;
        case 'rejoined':
          ctx.myPlayer = msg.player;
          setStatus('Reconnected.');
          break;
        case 'choose_seat':
          // Host set the numbers; the joiner (this client) picks first or second.
          $('roomInfo').classList.add('hidden');
          setStatus('');
          showChoosePanel(
            `Host set Target ${msg.target} · Max add ${msg.maxAdd}. Move first or second?`,
            () => { ctx.ws.send(JSON.stringify({ type: 'seat', mefirst: true })); setStatus('Starting…'); },
            () => { ctx.ws.send(JSON.stringify({ type: 'seat', mefirst: false })); setStatus('Starting…'); }
          );
          break;
        case 'opponent_choosing':
          $('roomInfo').classList.add('hidden');
          setStatus('Opponent is choosing who moves first…');
          break;
        case 'state':
          hideChoosePanel();
          $('roomInfo').classList.add('hidden');
          setStatus('');
          ctx.state = msg.state;
          if (msg.scores) ctx.scores = msg.scores;
          if (msg.move) logMove(playerLabel(msg.move.player), msg.move.n, msg.state.total);
          render();
          break;
        case 'opponent_disconnected':
          setStatus('Opponent disconnected — waiting for them to reconnect…');
          disableAdds();
          break;
        case 'opponent_reconnected':
          setStatus('Opponent reconnected.');
          render();
          break;
        case 'opponent_left':
          setStatus('Opponent left the game.');
          disableAdds();
          break;
        case 'error':
          setStatus('⚠ ' + msg.message);
          if (!ctx.token) ctx.left = true; // create/join failed — stop auto-reconnect
          break;
      }
    }

    function onlineMove(n) {
      if (!ctx.state || ctx.state.winner !== null) return;
      if (ctx.state.currentPlayer !== ctx.myPlayer) return; // not your turn
      ctx.ws.send(JSON.stringify({ type: 'move', n }));
    }

    // ===== Rendering (shared by all modes) =====
    function render() {
      const s = ctx.state;
      if (!s) return;
      $('totalDisplay').textContent = s.total;
      $('targetDisplay').textContent = `Target: ${s.target}  ·  Max add: ${s.maxAdd}`;
      renderScores();

      if (s.winner !== null) {
        showWinner(s.winner);
        $('turnDisplay').textContent = '';
        $('againBtn').classList.remove('hidden');
      } else {
        $('banner').classList.add('hidden');
        $('againBtn').classList.add('hidden');
        $('turnDisplay').textContent = turnText(s.currentPlayer);
      }

      renderControls(s);
    }

    // Online uses one shared button row; local modes use a column per player.
    function renderControls(s) {
      if (ctx.online) {
        $('twoCol').classList.add('hidden');
        $('addButtons').classList.remove('hidden');
        renderAddButtons(s.maxAdd);
        const myTurn = canMoveNow();
        document.querySelectorAll('#addButtons button').forEach((b) => { b.disabled = !myTurn; });
        return;
      }
      $('addButtons').classList.add('hidden');
      $('twoCol').classList.remove('hidden');
      renderTwoColButtons(s.maxAdd);
      $('nameP1').textContent = playerLabel(1);
      $('nameP2').textContent = playerLabel(2);
      [1, 2].forEach((p) => {
        const active = s.winner !== null ? s.winner === p : s.currentPlayer === p;
        $('colP' + p).classList.toggle('active', active);
        $('colP' + p).classList.toggle('dim', !active);
        const enabled = columnEnabled(p);
        $('addsP' + p).querySelectorAll('button').forEach((b) => { b.disabled = !enabled; });
      });
    }

    // Whether a given player's column is interactive right now.
    function columnEnabled(p) {
      const s = ctx.state;
      if (s.winner !== null) return false;
      if (s.currentPlayer !== p) return false;
      if (ctx.vsCpu && p === ctx.cpuPlayer) return false; // the computer moves itself
      return true;
    }

    function canMoveNow() {
      const s = ctx.state;
      if (s.winner !== null) return false;
      if (ctx.online) return s.currentPlayer === ctx.myPlayer;
      if (ctx.vsCpu) return s.currentPlayer !== ctx.cpuPlayer;
      return true; // hotseat: always the active human
    }

    function renderAddButtons(maxAdd) {
      const box = $('addButtons');
      if (box.childElementCount === maxAdd) return; // already built
      box.innerHTML = '';
      for (let i = 1; i <= maxAdd; i++) {
        const b = document.createElement('button');
        b.textContent = '+' + i;
        b.addEventListener('click', () => (ctx.online ? onlineMove(i) : localMove(i)));
        box.appendChild(b);
      }
    }

    function renderTwoColButtons(maxAdd) {
      [1, 2].forEach((p) => {
        const box = $('addsP' + p);
        if (box.childElementCount === maxAdd) return; // already built
        box.innerHTML = '';
        for (let i = 1; i <= maxAdd; i++) {
          const b = document.createElement('button');
          b.textContent = '+' + i;
          b.addEventListener('click', () => localMove(i));
          box.appendChild(b);
        }
      });
    }

    function disableAdds() { document.querySelectorAll('#addButtons button').forEach((b) => (b.disabled = true)); }

    function renderScores() {
      const box = $('scores');
      const sc = ctx.scores;
      if (!sc || (sc[1] === 0 && sc[2] === 0)) { box.classList.add('hidden'); return; }
      // Order the two sides from the local viewer's perspective.
      let leftP = 1, rightP = 2;
      if (ctx.online && ctx.myPlayer === 2) { leftP = 2; rightP = 1; }
      const cell = (p) => `<div class="sc"><div class="n">${sc[p]}</div><div class="who">${playerLabel(p)}</div></div>`;
      box.innerHTML = cell(leftP) + '<div class="dash">–</div>' + cell(rightP);
      box.classList.remove('hidden');
    }

    function turnText(player) {
      if (ctx.online) return player === ctx.myPlayer ? 'Your turn' : "Opponent's turn";
      if (ctx.vsCpu) return player === ctx.cpuPlayer ? "Computer's turn" : 'Your turn';
      return `Player ${player}'s turn`;
    }

    function playerLabel(player) {
      if (ctx.online) return player === ctx.myPlayer ? 'You' : 'Opponent';
      if (ctx.vsCpu) return player === ctx.cpuPlayer ? 'Computer' : 'You';
      return 'Player ' + player;
    }

    function showWinner(player) {
      const banner = $('banner');
      let text, lost = false;
      if (ctx.online) { text = player === ctx.myPlayer ? '🎉 You win!' : 'You lose.'; lost = player !== ctx.myPlayer; }
      else if (ctx.vsCpu) { text = player === ctx.cpuPlayer ? 'Computer wins.' : '🎉 You win!'; lost = player === ctx.cpuPlayer; }
      else { text = `🎉 Player ${player} wins!`; }
      banner.textContent = text;
      banner.classList.toggle('lose', lost);
      banner.classList.remove('hidden');
      setStatus('');
    }

    function logMove(who, n, total) {
      const div = document.createElement('div');
      div.textContent = `${who} added ${n} → total ${total}`;
      $('log').appendChild(div);
      $('log').scrollTop = $('log').scrollHeight;
    }

    function setStatus(msg) { $('status').textContent = msg; }
  </script>
</body>
</html>
